<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Vulcan Scheme Editor</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root {
    --app-bg: #16181d;
    --app-panel: #1e2129;
    --app-border: #2c303a;
    --app-text: #e6e8ec;
    --app-muted: #8b90a0;
    --app-accent: #5b8cff;
    --app-danger: #ff6b6b;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--app-bg);
    color: var(--app-text);
    font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  #app {
    display: flex;
    flex-direction: column;
    height: 100%;
  }
  header {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 14px;
    background: var(--app-panel);
    border-bottom: 1px solid var(--app-border);
    flex-wrap: wrap;
  }
  header h1 {
    font-size: 15px;
    margin: 0 12px 0 0;
    font-weight: 600;
    white-space: nowrap;
  }
  #buildTag {
    font-size: 10px;
    font-weight: 400;
    color: var(--app-muted);
    border: 1px solid var(--app-border);
    border-radius: 4px;
    padding: 1px 5px;
    vertical-align: middle;
  }
  header input[type="text"],
  header input[type="password"] {
    background: var(--app-bg);
    border: 1px solid var(--app-border);
    color: var(--app-text);
    border-radius: 6px;
    padding: 7px 10px;
    font-size: 13px;
  }
  #urlInput { flex: 1 1 320px; min-width: 200px; }
  .authField { width: 130px; }
  button {
    background: var(--app-accent);
    border: none;
    color: #fff;
    border-radius: 6px;
    padding: 7px 14px;
    font-size: 13px;
    cursor: pointer;
    font-weight: 500;
  }
  button.secondary {
    background: transparent;
    border: 1px solid var(--app-border);
    color: var(--app-text);
  }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  button.icon {
    background: transparent;
    border: 1px solid var(--app-border);
    color: var(--app-muted);
    padding: 4px 8px;
    font-size: 12px;
  }
  /* Its own fixed-height row, deliberately not inside the header. While it
     lived in that wrapping flex header, any status change could add or remove
     a header row and move the preview by ~25px. Hovering a link changes the
     status, so the page shifted under the cursor between hover and click and
     the click landed on whatever had moved into that spot. */
  #status {
    flex: 0 0 auto;
    height: 28px;
    line-height: 28px;
    padding: 0 14px;
    background: var(--app-panel);
    border-bottom: 1px solid var(--app-border);
    font-size: 12px;
    color: var(--app-muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  #status.error { color: var(--app-danger); }
  #loginFields { display: none; gap: 8px; align-items: center; }
  #loginFields.open { display: flex; }

  #body {
    flex: 1;
    display: flex;
    min-height: 0;
  }
  #editorPanel {
    width: 430px;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    background: var(--app-panel);
    border-right: 1px solid var(--app-border);
    min-height: 0;
  }
  #editorToolbar {
    padding: 10px;
    border-bottom: 1px solid var(--panel-line);
    display: flex;
    gap: 8px;
  }
  #filterInput {
    flex: 1;
    background: var(--app-bg);
    border: 1px solid var(--app-border);
    color: var(--app-text);
    border-radius: 6px;
    padding: 7px 10px;
    font-size: 13px;
  }
  #groups {
    flex: 1;
    overflow-y: auto;
    padding: 4px 0 12px;
  }
  .group {
    border-bottom: 1px solid var(--panel-line);
  }
  .group-header {
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 8px 12px;
    cursor: pointer;
    user-select: none;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--panel-dim);
    font-weight: 600;
  }
  .group-header .group-label { flex: 1 1 auto; }
  .group-count { color: var(--panel-dim); font-weight: 400; text-transform: none; letter-spacing: 0; }
  /* A collapsed group looked the same as an empty one, and nothing showed the
     header was clickable. A rotating caret states both. */
  .group-header::before {
    content: '';
    flex: 0 0 auto;
    width: 0;
    height: 0;
    border-left: 4.5px solid currentColor;
    border-top: 3.5px solid transparent;
    border-bottom: 3.5px solid transparent;
    transform: rotate(90deg);
    transition: transform 0.12s;
  }
  .group.collapsed .group-header::before { transform: rotate(0deg); }
  .group-header:hover { color: var(--panel-fg); }
  .group-rows { padding: 0 12px 8px; }
  .group.collapsed .group-rows { display: none; }
  .row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 7px 0;
  }
  .row-main { flex: 1 1 auto; min-width: 0; }
  /* A swatch has to stay legible whatever it holds: #060606 on a dark panel,
     #FFFFFF on a light one, and semi-transparent values in between. The
     checkerboard shows through anything translucent, and the two-tone ring
     (light inside, dark outside) keeps an edge against both extremes. The
     colour itself goes on an inner .fill so it never overwrites the
     checkerboard. */
  .swatch {
    width: 34px;
    height: 34px;
    border-radius: 5px;
    flex-shrink: 0;
    padding: 0;
    position: relative;
    overflow: hidden;
    background-color: #fff;
    background-image:
      linear-gradient(45deg, rgba(0,0,0,0.18) 25%, transparent 25%, transparent 75%, rgba(0,0,0,0.18) 75%),
      linear-gradient(45deg, rgba(0,0,0,0.18) 25%, transparent 25%, transparent 75%, rgba(0,0,0,0.18) 75%);
    background-size: 8px 8px;
    background-position: 0 0, 4px 4px;
    /* Both rings sit outside the swatch. An inset light ring reads as a white
       halo painted over the colour, which misrepresents it. Stacked outside,
       the dark ring defines the edge of a pale value on a light backdrop and
       the faint light ring does the same for a dark value on a dark one, while
       the colour itself stays untouched. */
    box-shadow:
      0 0 0 1px rgba(0, 0, 0, 0.4),
      0 0 0 2px rgba(255, 255, 255, 0.13);
  }
  .swatch .fill {
    position: absolute;
    inset: 0;
    border-radius: inherit;
  }
  .row .swatch input[type="color"] {
    position: absolute;
    inset: -4px;
    border: none;
    padding: 0;
    width: 42px;
    height: 42px;
    cursor: pointer;
    opacity: 0;
  }
  .row .swatch { cursor: pointer; }
  /* Two lines: the distinguishing segment in full, then the complete variable
     name underneath. Nothing is truncated away, so names that differ only in
     their last segment cannot read as duplicates. */
  .row .name {
    font-size: 12.5px;
    font-weight: 700;
    color: var(--panel-fg);
    cursor: pointer;
    overflow-wrap: anywhere;
  }
  .row .value {
    width: 104px;
    flex-shrink: 0;
    background: var(--app-bg);
    border: 1px solid var(--panel-line);
    color: var(--panel-fg);
    border-radius: 5px;
    padding: 4px 6px;
    font-size: 11.5px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  .row .value.changed { border-color: var(--app-accent); }
  .row .reset {
    flex-shrink: 0;
    background: transparent;
    border: none;
    color: var(--panel-dim);
    padding: 2px 4px;
    font-size: 13px;
    visibility: hidden;
  }
  .row .reset.visible { visibility: visible; }
  .row .reset:hover { color: var(--panel-fg); }

  #editorFooter {
    padding: 10px;
    border-top: 1px solid var(--panel-line);
    display: flex;
    gap: 8px;
  }
  #editorFooter button { flex: 1; }

  #deviceToggle { display: flex; }
  button.seg {
    background: transparent;
    border: 1px solid var(--app-border);
    color: var(--app-muted);
    border-radius: 0;
    padding: 7px 12px;
  }
  button.seg:first-child { border-radius: 6px 0 0 6px; }
  button.seg:last-child { border-radius: 0 6px 6px 0; border-left: none; }
  button.seg.active {
    background: var(--app-accent);
    border-color: var(--app-accent);
    color: #fff;
  }

  #previewWrap {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
  }
  #preview {
    flex: 1;
    border: none;
    width: 100%;
    height: 100%;
    background: #fff;
  }
  /* Narrowing the frame is what makes the page's own media queries fire, so
     the mobile view is the real responsive layout rather than a scaled
     screenshot of the desktop one. */
  #previewWrap.mobile {
    align-items: center;
    justify-content: flex-start;
    background: #0b0d11;
    padding: 18px 0;
    overflow: auto;
  }
  #previewWrap.mobile #preview {
    flex: none;
    width: 390px;
    height: 844px;
    max-height: none;
    border-radius: 20px;
    box-shadow: 0 0 0 6px #23262e, 0 10px 30px rgba(0, 0, 0, 0.5);
  }
  #placeholder {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--app-muted);
    font-size: 13px;
    text-align: center;
    padding: 40px;
  }

  /* The editor panel doubles as the scheme's spec sheet, so it carries its own
     backdrop that can be flipped independently of the app chrome. A near-black
     value is unreadable on a dark panel and a near-white one on a light panel,
     and no single choice suits both. */
  #editorPanel.light {
    --panel-bg: #f7f7f8;
    --panel-fg: #16181d;
    --panel-line: #e2e4e8;
    --panel-card: #ffffff;
    --panel-dim: #6b7080;
  }
  #editorPanel {
    --panel-bg: var(--app-panel);
    --panel-fg: var(--app-text);
    --panel-line: var(--app-border);
    --panel-card: #191c23;
    --panel-dim: var(--app-muted);
    background: var(--panel-bg);
    color: var(--panel-fg);
  }
  #editorPanel.light #filterInput,
  #editorPanel.light .row .value {
    background: #fff;
    color: var(--panel-fg);
    border-color: var(--panel-line);
  }
  /* button.secondary and friends are styled for the dark chrome, so on a light
     panel their text was white on white - the Inspect and Reset all controls
     vanished entirely. */
  #editorPanel.light button.secondary,
  #editorPanel.light button.icon,
  #editorPanel.light button.seg {
    color: var(--panel-fg);
    border-color: var(--panel-line);
  }
  #editorPanel.light button.seg { color: var(--panel-dim); }
  #editorPanel.light button.secondary:hover,
  #editorPanel.light button.icon:hover { background: rgba(0, 0, 0, 0.04); }
  #editorPanel.light button.seg.active,
  #editorPanel.light button.secondary.active,
  #editorPanel.light #inspectBtn.active {
    background: var(--app-accent);
    border-color: var(--app-accent);
    color: #fff;
  }

  #backdropBar {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 12px;
    border-bottom: 1px solid var(--panel-line);
  }
  #backdropBar .sv-hint { font-size: 11px; color: var(--panel-dim); }
  #backdropBar button.seg { padding: 4px 10px; font-size: 12px; }

  .sv-count { font-weight: 400; color: var(--panel-dim); }

  /* How many rules actually reference a variable. A scheme carries plenty of
     tokens nothing uses, and editing one of those changes nothing on the page
     - which reads as the tool being broken unless the row says so. */
  .use {
    margin-left: 6px;
    font-size: 9.5px;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 1px 5px;
    border-radius: 999px;
    border: 1px solid var(--panel-line);
    color: var(--panel-dim);
    vertical-align: middle;
  }
  .use.unused {
    color: #8a5a00;
    border-color: #e0b050;
    background: #fff5dd;
  }
  #editorPanel:not(.light) .use.unused {
    color: #ffcf70;
    border-color: #6b5320;
    background: #2a2312;
  }
  .use.hidden { display: none; }
  .sv-var {
    font-size: 10.5px;
    color: var(--panel-dim);
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    word-break: break-all;
  }

  /* The specimen is the content: a style shows its sizes as rendered lines of
     text, with the tokens that produce them collapsed until asked for. */
  .type-style {
    border-bottom: 1px solid var(--panel-line);
    padding: 14px 12px 16px;
    background: var(--panel-card);
  }
  .type-style-name {
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--panel-dim);
    margin-bottom: 10px;
  }
  .type-head {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 14px 0 4px;
    cursor: pointer;
    user-select: none;
  }
  .type-head::after {
    content: '';
    margin-left: auto;
    flex: 0 0 auto;
    width: 0;
    height: 0;
    border-left: 5px solid var(--panel-dim);
    border-top: 3.5px solid transparent;
    border-bottom: 3.5px solid transparent;
    transform: rotate(90deg);
    transition: transform 0.12s;
  }
  .type-head.collapsed::after { transform: rotate(0deg); }
  .type-head:hover::after { border-left-color: var(--panel-fg); }
  .bp-chip {
    flex: 0 0 auto;
    min-width: 20px;
    text-align: center;
    font-size: 10px;
    font-weight: 700;
    line-height: 16px;
    color: var(--panel-dim);
    border: 1px solid var(--panel-line);
    border-radius: 3px;
    padding: 0 3px;
  }
  .type-spec {
    font-size: 12px;
    color: var(--panel-dim);
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  /* Everything here comes from the captured values, so this rule must not set
     any of the properties being demonstrated. One line clipped with an
     ellipsis, so a 45px specimen still shows its true size instead of
     wrapping into a paragraph. */
  .type-specimen {
    margin: 0;
    color: var(--panel-fg);
    cursor: pointer;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .type-vars { display: block; }
  .type-vars.collapsed { display: none; }

  #svCopied {
    position: fixed;
    bottom: 18px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--app-accent);
    color: #fff;
    font-size: 12px;
    padding: 7px 14px;
    border-radius: 6px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.15s;
    z-index: 20;
  }
  #svCopied.show { opacity: 1; }

  #inspectBtn.active {
    background: var(--app-accent);
    border-color: var(--app-accent);
    color: #fff;
  }
  #inspector {
    display: none;
    border-bottom: 1px solid var(--panel-line);
    padding: 10px 12px;
    max-height: 45%;
    overflow-y: auto;
    flex-shrink: 0;
  }
  #inspector.open { display: block; }
  #inspectorHead {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 6px;
  }
  #inspectorTag {
    flex: 1;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 11.5px;
    color: var(--app-accent);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .inspect-section {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin: 8px 0 2px;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    font-weight: 600;
    color: var(--app-muted);
  }
  .inspect-var {
    padding: 3px 0 6px;
    border-top: 1px solid var(--app-border);
  }
  .inspect-var .name { cursor: pointer; }
  .decl-usage {
    display: flex;
    align-items: center;
    gap: 5px;
    color: var(--panel-dim);
    font-size: 10.5px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    padding-left: 28px;
    overflow: hidden;
    white-space: nowrap;
  }
  .decl-usage .text {
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .decl-usage .chip {
    width: 9px;
    height: 9px;
    border-radius: 2px;
    border: 1px solid var(--panel-line);
    flex-shrink: 0;
  }
  .decl-usage.inactive { opacity: 0.5; font-style: italic; }
  #inspectorEmpty { color: var(--panel-dim); font-size: 11.5px; }
  .row.highlight {
    background: rgba(91, 140, 255, 0.14);
    box-shadow: inset 2px 0 0 var(--app-accent);
    border-radius: 5px;
    padding-left: 6px;
  }
  @keyframes flashRow {
    0%, 100% { background: transparent; }
    30% { background: rgba(91, 140, 255, 0.4); }
  }
  .row.flash { animation: flashRow 0.9s ease; }

  #exportModal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    align-items: center;
    justify-content: center;
    z-index: 10;
  }
  #exportModal.open { display: flex; }
  #exportBox {
    background: var(--app-panel);
    border: 1px solid var(--app-border);
    border-radius: 8px;
    padding: 16px;
    width: 520px;
    max-width: 90vw;
  }
  #exportBox h2 { margin: 0 0 10px; font-size: 14px; }
  #exportModes { display: flex; margin-bottom: 8px; }
  #exportSummary {
    font-size: 12px;
    color: var(--app-muted);
    margin-bottom: 8px;
    min-height: 16px;
  }
  #exportText {
    width: 100%;
    height: 260px;
    background: var(--app-bg);
    color: var(--app-text);
    border: 1px solid var(--app-border);
    border-radius: 6px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 12px;
    padding: 10px;
    resize: vertical;
  }
  #exportActions {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    margin-top: 10px;
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>Vulcan Scheme Editor <span id="buildTag">fonts-v27</span></h1>
    <input id="urlInput" type="text" placeholder="example.com/page  (https:// optional)" />
    <button id="loginToggle" class="secondary">Basic Auth</button>
    <span id="loginFields">
      <input id="userInput" class="authField" type="text" placeholder="username" autocomplete="off" />
      <input id="passInput" class="authField" type="password" placeholder="password" autocomplete="off" />
    </span>
    <button id="loadBtn">Load real page</button>
    <button id="recaptureBtn" class="secondary" title="Re-capture the page currently in the preview" disabled>↻ Recapture</button>
    <span id="deviceToggle">
      <button id="desktopBtn" class="seg active" title="Desktop viewport (1440px)">Desktop</button>
      <button id="mobileBtn" class="seg" title="Mobile viewport (390px)">Mobile</button>
    </span>
  </header>
  <div id="status"></div>

  <div id="body">
    <div id="editorPanel">
      <div id="editorToolbar">
        <input id="filterInput" type="text" placeholder="Filter variables…" />
        <button id="inspectBtn" class="secondary" title="Click an element in the preview to see which scheme variables style it">Inspect</button>
      </div>
      <div id="backdropBar">
        <span class="sv-hint">Backdrop</span>
        <span id="backdropToggle">
          <button id="darkBackdropBtn" class="seg active" title="Judge colours against a dark background">Dark</button>
          <button id="lightBackdropBtn" class="seg" title="Judge colours against a light background">Light</button>
        </span>
      </div>
      <div id="inspector">
        <div id="inspectorHead">
          <span id="inspectorTag"></span>
          <button id="inspectParentBtn" class="icon" title="Select parent element">↑</button>
          <button id="inspectCloseBtn" class="icon" title="Close inspector">✕</button>
        </div>
        <div id="inspectorBody"></div>
      </div>
      <div id="groups"></div>
      <div id="editorFooter">
        <button id="resetAllBtn" class="secondary">Reset all</button>
        <button id="exportBtn">Export CSS…</button>
      </div>
    </div>
    <div id="previewWrap">
      <div id="placeholder">Paste a URL above and click "Load real page" to start editing its Vulcan scheme variables.</div>
      <iframe id="preview" sandbox="allow-same-origin" style="display:none"></iframe>
    </div>
  </div>
</div>

<div id="svCopied"></div>

<div id="exportModal">
  <div id="exportBox">
    <h2>Export CSS</h2>
    <div id="exportModes">
      <button class="seg" data-mode="changed-css">Changed CSS</button>
      <button class="seg" data-mode="all-css">Full :root</button>
    </div>
    <div id="exportSummary"></div>
    <textarea id="exportText" readonly spellcheck="false"></textarea>
    <div id="exportActions">
      <button id="exportCloseBtn" class="secondary">Close</button>
      <button id="exportDownloadBtn" class="secondary">Download</button>
      <button id="exportCopyBtn">Copy</button>
    </div>
  </div>
</div>

<script>
(function () {
  var state = {
    original: {},
    current: {},
    css: '',
    body: '',
    base: '',
    schemeNames: [],
    pageUrl: '',
    inspecting: true,
    selected: null,
    highlight: [],
    hoverHref: null,
    lastStatus: '',
    ruleIndex: null,
    device: 'desktop',
    capturedDevice: 'desktop',
    loading: false,
    backdrop: 'dark',
    exportMode: 'changed-css',
    pageFont: '',
    authored: {},
    edits: {},
    pageFontSize: '',
  };

  // Trailing tokens that identify which text property a typography variable
  // carries, so `--scheme-typography-buttonBig-mobile-font-size` and its
  // siblings can be gathered back into one specimen.
  // Real names spell the property in camelCase and put the breakpoint after it
  // (`--scheme-typography-buttonBig-fontSize-desktop`), so the property token
  // is neither kebab-case nor final. Each pattern matches either spelling
  // anywhere in the name; whatever is left over becomes the set's stem, which
  // keeps the breakpoint and so keeps `buttonBig-desktop` apart from
  // `buttonBig-mobile`.
  var TYPE_PROPS = [
    { prop: 'font-size', re: /-(?:fontsize|font-size)(?=-|$)/i },
    { prop: 'font-weight', re: /-(?:fontweight|font-weight)(?=-|$)/i },
    { prop: 'line-height', re: /-(?:lineheight|line-height)(?=-|$)/i },

        styleEl.appendChild(vars);

        // Collapsed to start so the specimens read as a type scale rather than
        // a list of tokens; the caret says they open, and they stay fully
        // editable once they do.
        vars.classList.add('collapsed');
        head.classList.add('collapsed');

        var toggle = function () {
          var collapsed = vars.classList.toggle('collapsed');
          head.classList.toggle('collapsed', collapsed);
        };
        head.addEventListener('click', toggle);
        specimen.addEventListener('click', toggle);

        block._set = variant;
        block._spec = spec;
        block._specimen = specimen;
        applyTypeSet(block);
        // Kept in the tree so refreshTypeSets can find it, without adding a
        // visible element of its own.
        block.style.display = 'none';
        styleEl.appendChild(block);
      });

      rowsEl.appendChild(styleEl);
    });

    groupEl.appendChild(rowsEl);
    els.groups.appendChild(groupEl);
  }

  // One row control per variable, used by both the main list and the
  // inspector panel, so a variable is edited the same way wherever it shows.
  function buildRow(name, titleOverride) {
    var row = document.createElement('div');
    row.className = 'row';
    row.setAttribute('data-var', name);
    if (state.highlight.indexOf(name) !== -1) row.classList.add('highlight');

    var swatch = document.createElement('div');
    swatch.className = 'swatch';

    var main = document.createElement('div');
    main.className = 'row-main';

    var label = document.createElement('div');
    label.className = 'name';
    label.textContent = titleOverride || lastSegment(name);
    label.title = name;

    var use = document.createElement('span');
    use.className = 'use hidden';
    label.appendChild(use);
    main.appendChild(label);

    // The complete name, always shown rather than truncated, so it can be read
    // and copied without hovering.
    var varLine = document.createElement('div');
    varLine.className = 'sv-var';
    varLine.textContent = name;
    varLine.title = 'Click to copy this variable name';
    varLine.style.cursor = 'pointer';
    varLine.addEventListener('click', function () {
      copyVarName(name);
    });
    main.appendChild(varLine);

    var input = document.createElement('input');
    input.className = 'value';
    input.type = 'text';
    input.addEventListener('change', function () {
      updateValue(name, input.value);
    });

    var resetBtn = document.createElement('button');
    resetBtn.className = 'reset';
    resetBtn.textContent = '↺';
    resetBtn.title = 'Reset to original value';
    resetBtn.addEventListener('click', function () {
      updateValue(name, state.original[name]);
    });

    row.appendChild(swatch);
    row.appendChild(main);
    row.appendChild(input);
    row.appendChild(resetBtn);

    row._varName = name;
    row._nameInput = input;
    row._nameSwatch = swatch;
    row._resetBtn = resetBtn;
    row._use = use;

    refreshRow(row);
    return row;
  }

  // The mockup's label: just the segment that names this token. The full
  // variable name is shown on its own line beneath, so nothing is hidden and
  // two tokens sharing a last segment are still told apart by that line.
  function lastSegment(name) {
    var short = name.replace(/^--scheme-/, '');
    var parts = short.split('-');
    return parts.length > 1 ? parts[parts.length - 1] : short;
  }

  // How many declarations in the captured CSS reference each variable. A
  // scheme normally defines more tokens than the page uses - a whole shelf of
  // font families where the design only wires up two - and editing one of the
  // rest changes nothing on screen. Without a count that looks like the editor
  // failing rather than the variable being unused.
  function usageCounts() {
    if (state.usage) return state.usage;
    var doc = previewDoc();
    if (!doc) return null;

    var counts = {};
    schemeRuleIndex().forEach(function (rule) {
      if (rule.literal) return;
      rule.vars.forEach(function (name) {
        counts[name] = (counts[name] || 0) + 1;
      });
    });
    state.usage = counts;
    return counts;
  }

  function refreshAllRows() {
    var rows = document.querySelectorAll('.row[data-var]');
    for (var i = 0; i < rows.length; i++) {
      if (rows[i]._varName) refreshRow(rows[i]);
    }
  }

  function refreshRow(row) {
    var name = row._varName;
    var value = state.current[name] || '';
    var changed = value !== state.original[name];

    // Only once the preview has rendered is there any CSS to count against;
    // until then the badge stays hidden rather than claiming nothing uses it.
    var counts = usageCounts();
    if (row._use) {
      var used = counts ? counts[name] || 0 : null;
      row._use.classList.toggle('hidden', used === null);
      row._use.classList.toggle('unused', used === 0);
      row._use.textContent = used === 0 ? 'unused' : used + '×';
      row._use.title = used === 0
        ? 'No rule in the captured CSS references this variable, so editing it will not change the page. The value it holds may still be applied somewhere hard-coded.'
        : used + ' declaration' + (used === 1 ? '' : 's') + ' reference this variable';
    }

    row._nameInput.value = value;
    row._nameInput.classList.toggle('changed', changed);
    row._resetBtn.classList.toggle('visible', changed);

    var swatch = row._nameSwatch;
    var picker = swatch.querySelector('input[type="color"]');
    var fill = swatch.querySelector('.fill');
    if (!fill) {
      fill = document.createElement('span');
      fill.className = 'fill';
      swatch.insertBefore(fill, swatch.firstChild);
    }

    var paint = colorCss(value);
    row._triplet = isTriplet(value);

    // Families get the page's own faces as suggestions; everything else stays
    // a plain field, so a size or a weight is not offered a list of fonts.
    if (isFamilyValue(value) || /font-?family/i.test(name)) {
      row._nameInput.setAttribute('list', 'fontFamilies');
      row._nameInput.title = 'Families used by this page — type any CSS value';
    } else {
      row._nameInput.removeAttribute('list');
      row._nameInput.removeAttribute('title');
    }

    if (paint) {
      fill.style.background = paint;
      swatch.style.display = '';
      var hex = toHexColor(paint);
      if (hex && !picker) {
        picker = document.createElement('input');
        picker.type = 'color';
        picker.addEventListener('input', function () {
          updateValue(name, row._triplet ? hexToTriplet(picker.value) : picker.value);
        });
        swatch.appendChild(picker);
      }
      // Leave the picker's own value alone while it is being dragged,
      // otherwise reassigning it mid-drag closes the OS colour dialog.
      if (picker && hex && document.activeElement !== picker) picker.value = hex;
      if (picker && !hex) swatch.removeChild(picker);
    } else {
      if (picker) swatch.removeChild(picker);
      // Not a colour: drop the square entirely rather than leave an empty
      // checkerboard implying one.
      fill.style.background = 'transparent';
      swatch.style.display = 'none';
    }
  }

  function updateValue(name, value) {
    // Back to the captured value means there is no edit any more, so the
    // authored declaration takes over again and dependents follow it.
    if (value === state.original[name]) delete state.edits[name];
    else state.edits[name] = value;

    state.current[name] = value;
    applyVar(name);
    // The same variable can be on screen twice (list + inspector); keep
    // every instance showing the same value.
    refreshRowsFor(name);
    refreshTypeSets(name);
    syncResolved();
  }

  function setBackdrop(backdrop) {
    state.backdrop = backdrop;
    els.editorPanel.classList.toggle('light', backdrop === 'light');
    els.lightBackdropBtn.classList.toggle('active', backdrop === 'light');
    els.darkBackdropBtn.classList.toggle('active', backdrop === 'dark');
  }

  function copyVarName(name) {
    var write = navigator.clipboard && navigator.clipboard.writeText
      ? navigator.clipboard.writeText(name)
      : Promise.reject();
    write.catch(function () {
      var ta = document.createElement('textarea');
      ta.value = name;
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); } catch (err) { /* nothing else to try */ }
      document.body.removeChild(ta);
    });

    els.svCopied.textContent = 'Copied ' + name;
    els.svCopied.classList.add('show');
    clearTimeout(state.copiedTimer);
    state.copiedTimer = setTimeout(function () {
      els.svCopied.classList.remove('show');
    }, 1400);
  }

  // Gathers `--scheme-typography-<stem>-<prop>` families back into one entry
  // per stem, so a specimen can be rendered with the real size, weight and
  // line height together instead of three unrelated numbers.
  // A breakpoint suffix names a variant of one style, not a style of its own,
  // so it is split off: `buttonBig-fontSize-desktop` and
  // `buttonBig-fontSize-mobile` are two variants of buttonBig rather than two
  // unrelated tokens. That is what lets one style show its sizes together.
  // The trailing digits matter: real schemes carry several steps within one
  // breakpoint (`-s`, `-s2`, `-s3`, `-m2`, `-m3`). Without them only the bare
  // suffix is recognised as a breakpoint, so `normal-fontSize-s2` folds the
  // number into the stem and invents a style called "normal-s2" sitting apart
  // from the very scale it belongs to.
  var BREAKPOINT = /^(desktop|tablet|mobile|xxl|xl|lg|md|sm|xs|d|t|m|l|s)\d*$/i;

  // A chip has room for a letter, not for "desktop", but "S" alone cannot tell
  // s from s2 and s3 - so the step number is kept and short names shown whole.
  function bpLabel(bp) {
    if (!bp) return '·';
    if (bp.length <= 3) return bp.toUpperCase();
    return bp.charAt(0).toUpperCase() + (bp.match(/\d+$/) || [''])[0];
  }

  function parseTypeVar(name) {
    // Only the scheme's own typography tokens form specimens. A page token
    // such as --font-weight-bold contains "font-weight" too, and reading it as
    // a typography set would conjure a style called "bold" out of one weight.
    if (name.indexOf('--scheme-') !== 0) return null;

    for (var i = 0; i < TYPE_PROPS.length; i++) {
      var entry = TYPE_PROPS[i];
      if (!entry.re.test(name)) continue;

      var rest = name
        .replace(entry.re, '')
        .replace(/^--scheme-/, '')
        .replace(/^(typography|fonts|font)-/, '')
        .replace(/-+/g, '-')
        .replace(/^-|-$/g, '');
      if (!rest) return null;

      var parts = rest.split('-');
      var bp = '';
      if (parts.length > 1 && BREAKPOINT.test(parts[parts.length - 1])) bp = parts.pop();
      return { style: parts.join('-'), bp: bp, prop: entry.prop };
    }
    return null;
  }

  function typographyStyles() {
    var styles = {};

    Object.keys(state.current).forEach(function (name) {
      var parsed = parseTypeVar(name);
      if (!parsed || !parsed.style) return;

      var style = styles[parsed.style];
      if (!style) style = styles[parsed.style] = { style: parsed.style, variants: {} };

      var variant = style.variants[parsed.bp];
      if (!variant) variant = style.variants[parsed.bp] = { bp: parsed.bp, props: {} };

      if (!variant.props[parsed.prop]) variant.props[parsed.prop] = name;
    });

    return Object.keys(styles).sort(compareStyleNames).map(function (key) {
      var style = styles[key];
      // Largest first, so a style reads as a scale rather than an arbitrary
      // list of breakpoints.
      style.list = Object.keys(style.variants)
        .map(function (bp) { return style.variants[bp]; })
        .sort(function (a, b) { return sizeOf(b) - sizeOf(a); });
      return style;
    });
  }

  function sizeOf(variant) {
    var name = variant.props['font-size'];
    var value = name ? state.current[name] : '';
    var px = parseFloat(value);
    return isNaN(px) ? 0 : px;
  }

  // h1..h6 in numeric order ahead of everything else, which is how a type
  // scale is normally read.
  function compareStyleNames(a, b) {
    var ha = a.match(/^h([1-6])$/i);
    var hb = b.match(/^h([1-6])$/i);
    if (ha && hb) return Number(ha[1]) - Number(hb[1]);
    if (ha) return -1;
    if (hb) return 1;
    return a.localeCompare(b);
  }

  function applyTypeSet(block) {
    var props = block._set.props;
    var value = function (prop) {
      return props[prop] ? state.current[props[prop]] : '';
    };

    var specimen = block._specimen;
    // Both fallbacks are the captured page's own body values, so a specimen
    // never renders at a size or in a face this app invented. Where the page
    // gave nothing, nothing is set.
    specimen.style.fontSize = value('font-size') || state.pageFontSize || '';
    specimen.style.lineHeight = value('line-height');
    specimen.style.fontWeight = value('font-weight');
    specimen.style.fontFamily = value('font-family') || state.pageFont || '';
    specimen.style.letterSpacing = value('letter-spacing');
    specimen.style.textTransform = value('text-transform');
    specimen.style.fontStyle = value('font-style');

    block._spec.textContent = ['font-size', 'line-height', 'font-weight']
      .map(value)
      .filter(Boolean)
      .join(' / ');
  }

  // Keeps a specimen in step with an edit without rebuilding the whole list,
  // so dragging a colour picker stays smooth.
  function refreshTypeSets(name) {
    var blocks = els.groups.querySelectorAll('.type-set');
    for (var i = 0; i < blocks.length; i++) {
      var props = blocks[i]._set && blocks[i]._set.props;
      if (!props) continue;
      var owns = Object.keys(props).some(function (p) {
        return props[p] === name;
      });
      if (owns) applyTypeSet(blocks[i]);
    }
  }

  function setDevice(device) {
    if (state.device === device) return;
    state.device = device;

    els.desktopBtn.classList.toggle('active', device === 'desktop');
    els.mobileBtn.classList.toggle('active', device === 'mobile');
    els.previewWrap.classList.toggle('mobile', device === 'mobile');

    // Resizing alone re-runs the page's media queries, which is the part that
    // matters for scheme work. Markup and asset choices were fixed at capture
    // time by the device's user-agent though, so say when those no longer
    // match rather than presenting a half-mobile view as the real thing.
    if (state.pageUrl && state.capturedDevice !== device) {
      setStatus('Showing ' + device + ' width · captured as ' + state.capturedDevice +
        ' — press ↻ Recapture for true ' + device + ' markup');
    } else if (state.pageUrl) {
      setStatus(device + ' view');
    }
  }

  function previewDoc() {
    try {
      return els.preview.contentDocument;
    } catch (err) {
      return null;
    }
  }

  function setInspecting(on) {
    state.inspecting = on;
    els.inspectBtn.classList.toggle('active', on);
    attachPreviewHandlers();
    if (on) {
      setStatus('Inspect mode: click any element in the preview');
    } else {
      hideOverlay();
      closeInspector();
      setStatus('Inspect off · clicking a link still loads that page');
    }
  }

  // The click handler is attached whatever the inspect state, because the
  // captured body contains real <a href> links and a sandboxed iframe is
  // still allowed to navigate itself. If it does, it loads the live site
  // cross-origin: the preview then shows a page this app cannot read and
  // does not know it is on, so state.pageUrl still names the previous one
  // and "recapture" appears to jump back. Every link click therefore has to
  // be intercepted and routed through a capture instead.
  function attachPreviewHandlers() {
    var doc = previewDoc();
    if (!doc || !doc.body) return false;

    doc.removeEventListener('click', onPreviewClick, true);
    doc.addEventListener('click', onPreviewClick, true);

    // Forms are the other way the iframe can navigate itself out of the
    // capture (a GET search form is enough).
    doc.removeEventListener('submit', onPreviewSubmit, true);
    doc.addEventListener('submit', onPreviewSubmit, true);

    doc.removeEventListener('mousemove', onPreviewHover, true);
    if (state.inspecting) doc.addEventListener('mousemove', onPreviewHover, true);

    doc.body.style.cursor = state.inspecting ? 'crosshair' : '';
    return true;
  }

  function onPreviewSubmit(e) {
    e.preventDefault();
    e.stopPropagation();
    setStatus('Form submissions are not followed in the preview', true);
  }

  function hideOverlay() {
    var doc = previewDoc();
    var overlay = doc && doc.getElementById(OVERLAY_ID);
    if (overlay) overlay.style.display = 'none';
  }

  function ensureOverlay(doc) {
    var overlay = doc.getElementById(OVERLAY_ID);
    if (!overlay) {
      overlay = doc.createElement('div');
      overlay.id = OVERLAY_ID;
      overlay.style.cssText =
        'position:fixed;pointer-events:none;z-index:2147483647;' +
        'border:2px solid #5b8cff;background:rgba(91,140,255,0.12);display:none;';
      doc.documentElement.appendChild(overlay);
    }
    return overlay;
  }

  function outlineElement(el) {
    var doc = previewDoc();
    if (!doc || !el) return;
    var overlay = ensureOverlay(doc);
    var rect = el.getBoundingClientRect();
    overlay.style.display = 'block';
    overlay.style.left = rect.left + 'px';
    overlay.style.top = rect.top + 'px';
    overlay.style.width = rect.width + 'px';
    overlay.style.height = rect.height + 'px';
  }

  function onPreviewHover(e) {
    if (!e.target || e.target.id === OVERLAY_ID) return;
    outlineElement(e.target);

    var href = linkTargetOf(e.target);
    if (href !== state.hoverHref) {
      setHoverStatus(href ? '→ ' + href + '   (click to load · shift-click to inspect)' : '');
      state.hoverHref = href;
    }
  }

  function onPreviewClick(e) {
    // Unconditional: letting the iframe follow a link itself would load the
    // live site cross-origin and desynchronise the whole editor.
    e.preventDefault();
    e.stopPropagation();

    // A plain click on a link browses to it by capturing that URL.
    // Shift-click falls through to inspecting the link element itself.
    var href = e.shiftKey ? null : linkTargetOf(e.target);
    if (href) {
      loadPage(href);
      return;
    }

    if (state.inspecting) selectElement(e.target);
  }

  // Resolves an anchor's href against the captured page's URL, and only for
  // links this app can actually capture.
  function linkTargetOf(node) {
    var el = node;
    while (el && el.nodeType === 1 && el.tagName !== 'A') el = el.parentElement;
    if (!el || el.nodeType !== 1) return null;

    var raw = el.getAttribute('href');
    if (!raw || raw.charAt(0) === '#') return null;

    try {
      var resolved = new URL(raw, state.pageUrl || state.base);
      if (!/^https?:$/.test(resolved.protocol)) return null;
      return resolved.toString();
    } catch (err) {
      return null;
    }
  }

  function selectElement(el) {
    if (!el || el.id === OVERLAY_ID) return;
    state.selected = el;
    outlineElement(el);

    var direct = markOverridden(schemeDeclsFor(el));
    var inherited = schemeDeclsInherited(el);
    var inside = schemeDeclsInside(el);
    renderInspector(el, direct, inherited, inside);

    var names = [];
    direct.concat(inherited, inside).forEach(function (d) {
      d.vars.forEach(function (n) {
        if (names.indexOf(n) === -1) names.push(n);
      });
    });
    state.highlight = names;
    renderGroups();

    els.inspector.classList.add('open');
  }

  function closeInspector() {
    els.inspector.classList.remove('open');
    state.selected = null;
    if (state.highlight.length) {
      state.highlight = [];
      renderGroups();
    }
    hideOverlay();
  }

  function describeElement(el) {
    var text = el.tagName.toLowerCase();
    if (el.id) text += '#' + el.id;
    var cls = (el.getAttribute('class') || '').trim();
    if (cls) text += '.' + cls.split(/\s+/).slice(0, 3).join('.');
    return text;
  }

  // Any captured variable, not only the --scheme-* ones: `font-family:
  // var(--font-base)` is exactly the declaration someone clicking a heading is
  // looking for. Names the capture did not return are dropped, since a
  // variable with no row behind it is nothing the inspector can offer.
  function extractVarNames(value) {
    var names = [];
    var re = /var\(\s*(--[A-Za-z0-9_-]+)/g;
    var match;
    while ((match = re.exec(value))) {
      if (!Object.prototype.hasOwnProperty.call(state.current, match[1])) continue;
      if (names.indexOf(match[1]) === -1) names.push(match[1]);
    }
    return names;
  }

  // Every declaration in the page that references a captured variable,
  // indexed once per capture. Built up front because inspecting a subtree
  // tests these against many elements, and re-walking every stylesheet each
  // time would be far slower than filtering a short pre-built list.
  function schemeRuleIndex() {
    if (state.ruleIndex) return state.ruleIndex;

    var doc = previewDoc();
    if (!doc) return [];

    var index = [];
    // Literals are kept apart from the variable index rather than mixed into
    // it: the subtree scope tests every indexed rule against a querySelectorAll,
    // so folding thousands of hard-coded declarations into the same list would
    // slow every inspection down for a scope that never shows them.
    var literals = [];
    var seen = {};

    // The enclosing @media condition travels with each declaration. A
    // responsive scheme sets the same property once per breakpoint, so without
    // it every breakpoint's rule looks equally in force and one element appears
    // to have two font sizes at once.
    function walk(rules, media) {
      for (var i = 0; i < rules.length; i++) {
        var rule = rules[i];
        if (rule.cssRules && !rule.selectorText) {
          var condition = rule.conditionText || (rule.media && rule.media.mediaText) || '';
          walk(rule.cssRules, condition ? (media ? media + ' and ' + condition : condition) : media);
          continue;
        }
        if (!rule.selectorText || !rule.style) continue;

        var decls = authoredDeclarations(rule);
        for (var j = 0; j < decls.length; j++) {
          var key = decls[j].prop + '|' + decls[j].value + '|' + rule.selectorText + '|' + (media || '');
          if (seen[key]) continue;
          seen[key] = true;
          // A declaration whose variables were all filtered out has nothing
          // editable behind it, so it would only lengthen the scan.
          var entry = {
            prop: decls[j].prop,
            expr: decls[j].value,
            selector: rule.selectorText,
            media: media || '',
            literal: !!decls[j].literal,
            vars: [],
          };
          if (entry.literal) {
            literals.push(entry);
            continue;
          }
          entry.vars = extractVarNames(decls[j].value);
          if (!entry.vars.length) continue;
          index.push(entry);
        }
      }
    }

    for (var s = 0; s < doc.styleSheets.length; s++) {
      var rules;
      try {
        rules = doc.styleSheets[s].cssRules;
      } catch (err) {
        continue;
      }
      if (rules) walk(rules, '');
    }

    state.ruleIndex = index;
    state.literalIndex = literals;
    return index;
  }

  // Declarations that write a value straight into a rule, on the element or on
  // an ancestor it inherits type from. This is the answer to "I changed the
  // family variable and the title did not move": the rule painting it never
  // referenced a variable, so no edit here can reach it.
  function hardcodedFor(el) {
    schemeRuleIndex();
    var literals = state.literalIndex || [];
    var doc = previewDoc();
    var computed = doc ? doc.defaultView.getComputedStyle(el) : null;
    var out = [];
    // The nearest declaration of a property is the one worth reporting, so a
    // family named again on every ancestor is not listed five times.
    var claimed = {};

    // A family is only reported if the element really is rendering in it. The
    // browser has already resolved the whole cascade, so asking it settles
    // which of several matching rules actually won - guesswork this app cannot
    // do from selectors alone.
    var paints = function (d) {
      if (d.prop !== 'font-family' || !computed) return true;
      return firstFamily(computed.fontFamily) === firstFamily(d.expr);
    };

    var live = function (d) {
      return mediaApplies(d.media) && !d.overridden && paints(d);
    };

    var take = function (target, from) {
      var here = markOverridden(
        literals.filter(function (rule) {
          if (claimed[rule.prop]) return false;
          if (from && !INHERITABLE.test(rule.prop)) return false;
          return selectorMatches(target, rule.selector);
        })
      ).filter(live);

      here.forEach(function (d) {
        out.push(from ? Object.assign({}, d, { from: from }) : d);
      });
      here.forEach(function (d) {
        claimed[d.prop] = true;
      });
    };

    take(el, '');

    var ancestor = el.parentElement;
    while (ancestor && ancestor.tagName !== 'HTML') {
      take(ancestor, describeElement(ancestor));
      ancestor = ancestor.parentElement;
    }

    return out;
  }

  function firstFamily(value) {
    return String(value || '').split(',')[0].replace(/['"]/g, '').trim().toLowerCase();
  }

  // Whether a rule's media condition holds at the preview's current width. A
  // declaration behind a query that does not currently match is real but is not
  // what the element is painted with.
  function mediaApplies(media) {
    if (!media) return true;
    var doc = previewDoc();
    if (!doc || !doc.defaultView || !doc.defaultView.matchMedia) return true;
    try {
      return doc.defaultView.matchMedia(media).matches;
    } catch (err) {
      return true;
    }
  }

  // Marks every declaration that matches the current width but loses to a
  // later one for the same property, so only the winner shows a resolved value.
  function markOverridden(decls) {
    var lastLive = {};
    decls.forEach(function (d, i) {
      d.overridden = false;
      if (mediaApplies(d.media)) lastLive[d.prop] = i;
    });
    decls.forEach(function (d, i) {
      if (mediaApplies(d.media) && lastLive[d.prop] !== i) d.overridden = true;
    });
    return decls;
  }

  // Declarations applying to the element itself.
  function schemeDeclsFor(el) {
    return schemeRuleIndex().filter(function (rule) {
      return selectorMatches(el, rule.selector);
    });
  }

  // Inheritable declarations coming from ancestors. Text colour and type are
  // usually set once high up rather than on the element being looked at, so
  // without this the variable actually painting an element's text is missing
  // from its panel entirely.
  function schemeDeclsInherited(el) {
    var index = schemeRuleIndex();
    var out = [];
    var ancestor = el.parentElement;

    while (ancestor && ancestor.nodeType === 1) {
      var label = describeElement(ancestor);
      index.forEach(function (rule) {
        if (!INHERITABLE.test(rule.prop)) return;
        if (!selectorMatches(ancestor, rule.selector)) return;
        out.push(Object.assign({}, rule, { from: label }));
      });
      ancestor = ancestor.parentElement;
    }
    return out;
  }

  // Declarations applying to anything inside the element. A container like a
  // review card carries almost no variables of its own - everything visible
  // in it (button, heading, stars) is styled by rules on its descendants.
  function schemeDeclsInside(el) {
    var out = [];
    schemeRuleIndex().forEach(function (rule) {
      var hits = matchesWithin(el, rule.selector);
      if (hits) out.push(Object.assign({}, rule, { count: hits }));
    });
    return out;
  }

  function matchesWithin(el, selectorText) {
    try {
      return el.querySelectorAll(selectorText).length;
    } catch (err) {
      try {
        return el.querySelectorAll(withoutPseudo(selectorText)).length;
      } catch (err2) {
        return 0;
      }
    }
  }

  function withoutPseudo(selectorText) {
    return selectorText.replace(/::?[a-zA-Z-]+(\([^)]*\))?/g, '');
  }

  // Reads declarations from the rule's own text rather than iterating
  // rule.style. CSSOM expands shorthands into longhands, and a longhand
  // whose value came from a shorthand containing var() reads back as an
  // empty string — so `background: var(--scheme-x)` is invisible via
  // rule.style. Parsing the authored text also keeps the property name the
  // author wrote instead of listing four border-*-color longhands.
  function authoredDeclarations(rule) {
    var out = [];
    var text = rule.cssText || '';
    var open = text.indexOf('{');
    var close = text.lastIndexOf('}');
    if (open === -1 || close === -1) return out;

    var block = text.slice(open + 1, close);
    var depth = 0;
    var current = '';
    var parts = [];
    for (var i = 0; i < block.length; i++) {
      var ch = block.charAt(i);
      if (ch === '(') depth++;
      else if (ch === ')') depth--;
      if (ch === ';' && depth === 0) {
        parts.push(current);
        current = '';
        continue;
      }
      current += ch;
    }
    parts.push(current);

    parts.forEach(function (decl) {
      var colon = decl.indexOf(':');
      if (colon === -1) return;
      var prop = decl.slice(0, colon).trim();
      var value = decl.slice(colon + 1).trim();
      if (!prop) return;
      var hasVar = value.indexOf('var(--') !== -1;
      // Declarations with no variable in them are kept for a short list of
      // properties, so the inspector can say "this face is written into the
      // rule" instead of leaving someone editing a variable that was never
      // going to move it.
      if (!hasVar && !WATCHED_LITERAL.test(prop)) return;
      out.push({ prop: prop, value: value, literal: !hasVar });
    });
    return out;
  }

  function selectorMatches(el, selectorText) {
    try {
      return el.matches(selectorText);
    } catch (err) {
      // Pseudo-element selectors (.btn::before) throw; match the base
      // selector so the pseudo-element's variables still surface.
      try {
        return el.matches(withoutPseudo(selectorText));
      } catch (err2) {
        return false;
      }
    }
  }

  function renderInspector(el, direct, inherited, inside) {
    var label = describeElement(el);
    els.inspectorTag.textContent = label;
    els.inspectorTag.title = label;
    els.inspectorBody.innerHTML = '';

    // Anything already listed is skipped, so each variable gets exactly one
    // editable row and the sections read as a progression: set here, handed
    // down to here, used somewhere below here.
    var shown = {};
    var counts =
      renderVarSection('On this element', direct, el, shown, false) +
      renderVarSection('Inherited from ancestors', inherited, el, shown, false) +
      renderVarSection('Inside this element', inside, el, shown, true);

    var fixed = renderHardcoded(el);

    if (!counts && !fixed) {
      var empty = document.createElement('div');
      empty.id = 'inspectorEmpty';
      empty.textContent = 'No captured variables style this element, anything inside it, or reach it by inheritance.';
      els.inspectorBody.appendChild(empty);
    }
  }

  // Written into the rule, with no variable in the way. Nothing here is
  // editable, and that is the point: it says why changing a variable left this
  // part of the page alone.
  function renderHardcoded(el) {
    var decls = hardcodedFor(el);
    if (!decls.length) return 0;

    var header = document.createElement('div');
    header.className = 'inspect-section';
    header.innerHTML = '<span>Hard-coded — no variable</span><span>' + decls.length + '</span>';
    els.inspectorBody.appendChild(header);

    decls.forEach(function (d) {
      var usage = document.createElement('div');
      usage.className = 'decl-usage';

      var chipColor = colorCss(d.expr);
      if (chipColor) {
        var chip = document.createElement('span');
        chip.className = 'chip';
        chip.style.background = chipColor;
        usage.appendChild(chip);
      }

      var text = document.createElement('span');
      text.className = 'text';
      text.textContent =
        d.prop + ' · ' + d.selector + ' → ' + d.expr +
        (d.from ? '  ↑ ' + d.from : '') +
        (d.media ? '  @' + d.media : '');
      usage.appendChild(text);
      usage.title =
        (d.media ? '@media ' + d.media + '\n' : '') +
        d.selector + ' { ' + d.prop + ': ' + d.expr + ' }' +
        (d.from ? '\ninherited from ' + d.from : '') +
        '\nThis value is written into the rule, not taken from a variable, so no edit in this tool changes it.';

      els.inspectorBody.appendChild(usage);
    });

    return decls.length;
  }

  function renderVarSection(title, decls, el, shown, isDescendant) {
    var doc = previewDoc();
    // For inherited rules the computed value on the selected element is the
    // effective one, which is exactly what is wanted here.
    var computed = doc && !isDescendant ? doc.defaultView.getComputedStyle(el) : null;

    // Group by variable so each appears once as a single editable row, with
    // the declarations that reference it listed underneath.
    var order = [];
    var usages = {};
    decls.forEach(function (d) {
      d.vars.forEach(function (name) {
        if (shown[name]) return;
        if (!usages[name]) {
          usages[name] = [];
          order.push(name);
        }
        usages[name].push(d);
      });
    });

    if (!order.length) return 0;

    var header = document.createElement('div');
    header.className = 'inspect-section';
    header.innerHTML = '<span>' + title + '</span><span>' + order.length + '</span>';
    els.inspectorBody.appendChild(header);

    order.forEach(function (name) {
      shown[name] = true;

      var wrap = document.createElement('div');
      wrap.className = 'inspect-var';

      var row = buildRow(name);
      // Every variable here relates to the selection, so the highlight that
      // marks them in the main list would just be noise in this panel.
      row.classList.remove('highlight');
      row.querySelector('.name').addEventListener('click', function () {
        jumpToVar(name);
      });
      row.querySelector('.name').title = name + ' — click to find it in the list below';
      wrap.appendChild(row);

      usages[name].forEach(function (d) {
        var usage = document.createElement('div');
        usage.className = 'decl-usage';

        // Only the selected element has a single computed value to report; a
        // descendant selector can match many elements at once.
        var resolved = computed ? computed.getPropertyValue(d.prop).trim() : '';
        // Shorthands compute to long strings ("rgb(16,24,32) none repeat
        // scroll 0% 0% / auto padding-box border-box") - not worth showing.
        if (resolved.length > 40) resolved = '';

        var chipColor = resolved ? colorCss(resolved) : null;
        if (chipColor) {
          var chip = document.createElement('span');
          chip.className = 'chip';
          chip.style.background = chipColor;
          usage.appendChild(chip);
        }

        // Two separate reasons a declaration is not what you are looking at:
        // its query does not match the current width, or it matches but a later
        // one for the same property wins. Either way its resolved value would
        // be misleading beside it.
        var live = mediaApplies(d.media);
        var note = '';
        if (!live) note = '  (not at this width)';
        else if (d.overridden) note = '  (overridden)';
        if (note) {
          resolved = '';
          usage.classList.add('inactive');
        }

        var text = document.createElement('span');
        text.className = 'text';
        text.textContent =
          d.prop + ' · ' + d.selector +
          (resolved ? ' → ' + resolved : '') +
          (d.count > 1 ? '  ×' + d.count : '') +
          (d.from ? '  ↑ ' + d.from : '') +
          (d.media ? '  @' + d.media : '') + note;
        usage.appendChild(text);
        usage.title =
          (d.media ? '@media ' + d.media + '\n' : '') +
          d.selector + ' { ' + d.prop + ': ' + d.expr + ' }' +
          (d.from ? '\ninherited from ' + d.from : '') +
          (live ? '' : '\nThis breakpoint does not apply at the current preview width.') +
          (live && d.overridden ? '\nA later declaration for this property wins.' : '');

        wrap.appendChild(usage);
      });

      els.inspectorBody.appendChild(wrap);
    });

    return order.length;
  }

  function jumpToVar(name) {
    var filter = els.filterInput.value.trim().toLowerCase();
    if (filter && name.toLowerCase().indexOf(filter) === -1) {
      els.filterInput.value = '';
      renderGroups();
    }
    var row = els.groups.querySelector('[data-var="' + name + '"]');
    if (!row) return;
    var group = row.closest('.group');
    if (group) group.classList.remove('collapsed');
    row.scrollIntoView({ block: 'center', behavior: 'smooth' });
    row.classList.remove('flash');
    void row.offsetWidth;
    row.classList.add('flash');
  }

  function changedVars() {
    var out = {};
    Object.keys(state.edits).forEach(function (name) {
      out[name] = state.edits[name];
    });
    return out;
  }

  function openExport() {
    // Applying a scheme means applying what changed, so that leads; the full
    // block stays available for handing on a whole scheme.
    var changes = changedVars();
    state.exportMode = Object.keys(changes).length ? 'changed-css' : 'all-css';
    renderExport();
    els.exportModal.classList.add('open');
  }

  function renderExport() {
    var changes = changedVars();
    var count = Object.keys(changes).length;

    var buttons = els.exportModes.querySelectorAll('button');
    for (var i = 0; i < buttons.length; i++) {
      buttons[i].classList.toggle('active', buttons[i].getAttribute('data-mode') === state.exportMode);
    }

    if (state.exportMode === 'all-css') {
      // Authored values, so an exported token that derived from another still
      // derives from it rather than being frozen to a literal.
      var full = Object.assign({}, state.authored, state.edits);
      els.exportText.value = buildRootBlock(full);
      els.exportSummary.textContent =
        Object.keys(full).length + ' variables — the whole scheme, keeping var() references.';
    } else {
      els.exportText.value = count ? buildRootBlock(changes) : '';
      els.exportSummary.textContent = count
        ? count + ' changed variable' + (count === 1 ? '' : 's') + ' — only these differ from the page.'
        : 'Nothing changed yet.';
    }
  }

  function downloadExport() {
    var host = 'scheme';
    try {
      host = new URL(state.pageUrl).hostname.replace(/^www\./, '');
    } catch (err) {
      // keep the fallback
    }

    var blob = new Blob([els.exportText.value], { type: 'text/css' });
    var link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = host + '-scheme.css';
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    setTimeout(function () {
      URL.revokeObjectURL(link.href);
    }, 1000);
  }

  function closeExport() {
    els.exportModal.classList.remove('open');
  }

  async function copyExport() {
    try {
      await navigator.clipboard.writeText(els.exportText.value);
      els.exportCopyBtn.textContent = 'Copied!';
    } catch (err) {
      els.exportText.select();
      document.execCommand('copy');
      els.exportCopyBtn.textContent = 'Copied!';
    }
    setTimeout(function () {
      els.exportCopyBtn.textContent = 'Copy';
    }, 1500);
  }
})();
</script>
</body>
</html>
