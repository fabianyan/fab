<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Vulcan Scheme Editor</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root {
    --app-bg: #16181d;
    --app-panel: #1e2129;
    --app-border: #2c303a;
    --app-text: #e6e8ec;
    --app-muted: #8b90a0;
    --app-accent: #5b8cff;
    --app-danger: #ff6b6b;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--app-bg);
    color: var(--app-text);
    font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  #app {
    display: flex;
    flex-direction: column;
    height: 100%;
  }
  header {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 14px;
    background: var(--app-panel);
    border-bottom: 1px solid var(--app-border);
    flex-wrap: wrap;
  }
  header h1 {
    font-size: 15px;
    margin: 0 12px 0 0;
    font-weight: 600;
    white-space: nowrap;
  }
  #buildTag {
    font-size: 10px;
    font-weight: 400;
    color: var(--app-muted);
    border: 1px solid var(--app-border);
    border-radius: 4px;
    padding: 1px 5px;
    vertical-align: middle;
  }
  header input[type="text"],
  header input[type="password"] {
    background: var(--app-bg);
    border: 1px solid var(--app-border);
    color: var(--app-text);
    border-radius: 6px;
    padding: 7px 10px;
    font-size: 13px;
  }
  #urlInput { flex: 1 1 320px; min-width: 200px; }
  .authField { width: 130px; }
  button {
    background: var(--app-accent);
    border: none;
    color: #fff;
    border-radius: 6px;
    padding: 7px 14px;
    font-size: 13px;
    cursor: pointer;
    font-weight: 500;
  }
  button.secondary {
    background: transparent;
    border: 1px solid var(--app-border);
    color: var(--app-text);
  }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  button.icon {
    background: transparent;
    border: 1px solid var(--app-border);
    color: var(--app-muted);
    padding: 4px 8px;
    font-size: 12px;
  }
  #status {
    font-size: 12px;
    color: var(--app-muted);
    margin-left: auto;
    white-space: nowrap;
  }
  #status.error { color: var(--app-danger); }
  #loginFields { display: none; gap: 8px; align-items: center; }
  #loginFields.open { display: flex; }

  #body {
    flex: 1;
    display: flex;
    min-height: 0;
  }
  #editorPanel {
    width: 380px;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    background: var(--app-panel);
    border-right: 1px solid var(--app-border);
    min-height: 0;
  }
  #editorToolbar {
    padding: 10px;
    border-bottom: 1px solid var(--app-border);
    display: flex;
    gap: 8px;
  }
  #filterInput {
    flex: 1;
    background: var(--app-bg);
    border: 1px solid var(--app-border);
    color: var(--app-text);
    border-radius: 6px;
    padding: 7px 10px;
    font-size: 13px;
  }
  #groups {
    flex: 1;
    overflow-y: auto;
    padding: 4px 0 12px;
  }
  .group {
    border-bottom: 1px solid var(--app-border);
  }
  .group-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 12px;
    cursor: pointer;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--app-muted);
    font-weight: 600;
  }
  .group-count { color: var(--app-muted); font-weight: 400; text-transform: none; letter-spacing: 0; }
  .group-rows { padding: 0 12px 8px; }
  .group.collapsed .group-rows { display: none; }
  .row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 5px 0;
  }
  .row .swatch {
    width: 20px;
    height: 20px;
    border-radius: 5px;
    border: 1px solid var(--app-border);
    flex-shrink: 0;
    padding: 0;
    position: relative;
    overflow: hidden;
    background: #fff;
  }
  .row .swatch input[type="color"] {
    position: absolute;
    inset: -4px;
    border: none;
    padding: 0;
    width: 28px;
    height: 28px;
    cursor: pointer;
  }
  .row .name {
    flex: 1 1 auto;
    font-size: 11.5px;
    color: var(--app-text);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .row .name .prefix { color: var(--app-muted); }
  .row .value {
    width: 110px;
    flex-shrink: 0;
    background: var(--app-bg);
    border: 1px solid var(--app-border);
    color: var(--app-text);
    border-radius: 5px;
    padding: 4px 6px;
    font-size: 11.5px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  .row .value.changed { border-color: var(--app-accent); }
  .row .reset {
    flex-shrink: 0;
    background: transparent;
    border: none;
    color: var(--app-muted);
    padding: 2px 4px;
    font-size: 13px;
    visibility: hidden;
  }
  .row .reset.visible { visibility: visible; }
  .row .reset:hover { color: var(--app-text); }

  #editorFooter {
    padding: 10px;
    border-top: 1px solid var(--app-border);
    display: flex;
    gap: 8px;
  }
  #editorFooter button { flex: 1; }

  #previewWrap {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
  }
  #preview {
    flex: 1;
    border: none;
    width: 100%;
    height: 100%;
    background: #fff;
  }
  #placeholder {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--app-muted);
    font-size: 13px;
    text-align: center;
    padding: 40px;
  }

  #inspectBtn.active {
    background: var(--app-accent);
    border-color: var(--app-accent);
    color: #fff;
  }
  #inspector {
    display: none;
    border-bottom: 1px solid var(--app-border);
    padding: 10px 12px;
    max-height: 45%;
    overflow-y: auto;
    flex-shrink: 0;
  }
  #inspector.open { display: block; }
  #inspectorHead {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 6px;
  }
  #inspectorTag {
    flex: 1;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 11.5px;
    color: var(--app-accent);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .inspect-section {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin: 8px 0 2px;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    font-weight: 600;
    color: var(--app-muted);
  }
  .inspect-var {
    padding: 3px 0 6px;
    border-top: 1px solid var(--app-border);
  }
  .inspect-var .name { cursor: pointer; }
  .decl-usage {
    display: flex;
    align-items: center;
    gap: 5px;
    color: var(--app-muted);
    font-size: 10.5px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    padding-left: 28px;
    overflow: hidden;
    white-space: nowrap;
  }
  .decl-usage .text {
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .decl-usage .chip {
    width: 9px;
    height: 9px;
    border-radius: 2px;
    border: 1px solid var(--app-border);
    flex-shrink: 0;
  }
  #inspectorEmpty { color: var(--app-muted); font-size: 11.5px; }
  .row.highlight {
    background: rgba(91, 140, 255, 0.14);
    box-shadow: inset 2px 0 0 var(--app-accent);
    border-radius: 5px;
    padding-left: 6px;
  }
  @keyframes flashRow {
    0%, 100% { background: transparent; }
    30% { background: rgba(91, 140, 255, 0.4); }
  }
  .row.flash { animation: flashRow 0.9s ease; }

  #exportModal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    align-items: center;
    justify-content: center;
    z-index: 10;
  }
  #exportModal.open { display: flex; }
  #exportBox {
    background: var(--app-panel);
    border: 1px solid var(--app-border);
    border-radius: 8px;
    padding: 16px;
    width: 520px;
    max-width: 90vw;
  }
  #exportBox h2 { margin: 0 0 10px; font-size: 14px; }
  #exportText {
    width: 100%;
    height: 260px;
    background: var(--app-bg);
    color: var(--app-text);
    border: 1px solid var(--app-border);
    border-radius: 6px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 12px;
    padding: 10px;
    resize: vertical;
  }
  #exportActions {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    margin-top: 10px;
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>Vulcan Scheme Editor <span id="buildTag">subtree-v8</span></h1>
    <input id="urlInput" type="text" placeholder="example.com/page  (https:// optional)" />
    <button id="loginToggle" class="secondary">Basic Auth</button>
    <span id="loginFields">
      <input id="userInput" class="authField" type="text" placeholder="username" autocomplete="off" />
      <input id="passInput" class="authField" type="password" placeholder="password" autocomplete="off" />
    </span>
    <button id="loadBtn">Load real page</button>
    <button id="recaptureBtn" class="secondary" title="Re-capture the page currently in the preview" disabled>↻ Recapture</button>
    <span id="status"></span>
  </header>

  <div id="body">
    <div id="editorPanel">
      <div id="editorToolbar">
        <input id="filterInput" type="text" placeholder="Filter variables…" />
        <button id="inspectBtn" class="secondary" title="Click an element in the preview to see which scheme variables style it">Inspect</button>
      </div>
      <div id="inspector">
        <div id="inspectorHead">
          <span id="inspectorTag"></span>
          <button id="inspectParentBtn" class="icon" title="Select parent element">↑</button>
          <button id="inspectCloseBtn" class="icon" title="Close inspector">✕</button>
        </div>
        <div id="inspectorBody"></div>
      </div>
      <div id="groups"></div>
      <div id="editorFooter">
        <button id="resetAllBtn" class="secondary">Reset all</button>
        <button id="exportBtn">Export :root</button>
      </div>
    </div>
    <div id="previewWrap">
      <div id="placeholder">Paste a URL above and click "Load real page" to start editing its Vulcan scheme variables.</div>
      <iframe id="preview" sandbox="allow-same-origin" style="display:none"></iframe>
    </div>
  </div>
</div>

<div id="exportModal">
  <div id="exportBox">
    <h2>Exported :root block</h2>
    <textarea id="exportText" readonly spellcheck="false"></textarea>
    <div id="exportActions">
      <button id="exportCloseBtn" class="secondary">Close</button>
      <button id="exportCopyBtn">Copy</button>
    </div>
  </div>
</div>

<script>
(function () {
  var state = {
    original: {},
    current: {},
    css: '',
    body: '',
    base: '',
    schemeNames: [],
    pageUrl: '',
    inspecting: true,
    selected: null,
    highlight: [],
    hoverHref: null,
    lastStatus: '',
    ruleIndex: null,
  };

  var OVERLAY_ID = 'scheme-app-inspect-overlay';

  var els = {
    urlInput: document.getElementById('urlInput'),
    loginToggle: document.getElementById('loginToggle'),
    loginFields: document.getElementById('loginFields'),
    userInput: document.getElementById('userInput'),
    passInput: document.getElementById('passInput'),
    loadBtn: document.getElementById('loadBtn'),
    recaptureBtn: document.getElementById('recaptureBtn'),
    status: document.getElementById('status'),
    filterInput: document.getElementById('filterInput'),
    groups: document.getElementById('groups'),
    resetAllBtn: document.getElementById('resetAllBtn'),
    exportBtn: document.getElementById('exportBtn'),
    preview: document.getElementById('preview'),
    placeholder: document.getElementById('placeholder'),
    exportModal: document.getElementById('exportModal'),
    exportText: document.getElementById('exportText'),
    exportCloseBtn: document.getElementById('exportCloseBtn'),
    exportCopyBtn: document.getElementById('exportCopyBtn'),
    inspectBtn: document.getElementById('inspectBtn'),
    inspector: document.getElementById('inspector'),
    inspectorTag: document.getElementById('inspectorTag'),
    inspectorBody: document.getElementById('inspectorBody'),
    inspectParentBtn: document.getElementById('inspectParentBtn'),
    inspectCloseBtn: document.getElementById('inspectCloseBtn'),
  };

  els.loginToggle.addEventListener('click', function () {
    els.loginFields.classList.toggle('open');
  });

  els.urlInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') loadPage(els.urlInput.value);
  });
  els.loadBtn.addEventListener('click', function () {
    loadPage(els.urlInput.value);
  });
  els.recaptureBtn.addEventListener('click', function () {
    // Deliberately ignores the input box - this re-pulls the page that is
    // actually on screen, even if something else has been typed since.
    if (state.pageUrl) loadPage(state.pageUrl);
  });
  els.filterInput.addEventListener('input', renderGroups);
  els.resetAllBtn.addEventListener('click', function () {
    state.current = Object.assign({}, state.original);
    renderGroups();
    applyAllVars();
  });
  els.exportBtn.addEventListener('click', openExport);
  els.exportCloseBtn.addEventListener('click', closeExport);
  els.exportCopyBtn.addEventListener('click', copyExport);

  els.inspectBtn.addEventListener('click', function () {
    setInspecting(!state.inspecting);
  });
  els.inspectCloseBtn.addEventListener('click', closeInspector);
  els.inspectParentBtn.addEventListener('click', function () {
    if (state.selected && state.selected.parentElement) {
      selectElement(state.selected.parentElement);
    }
  });
  els.preview.addEventListener('load', function () {
    state.selected = null;
    // Belongs to the document that was just replaced.
    state.ruleIndex = null;
    els.inspectBtn.classList.toggle('active', state.inspecting);
    if (state.inspecting) enableInspect();
  });

  function setStatus(text, isError) {
    state.lastStatus = text || '';
    els.status.textContent = state.lastStatus;
    els.status.classList.toggle('error', !!isError);
  }

  // Transient message shown while hovering, which must not overwrite the
  // real status that setStatus is holding.
  function setHoverStatus(text) {
    els.status.textContent = text || state.lastStatus || '';
    els.status.classList.remove('error');
  }

  function familyOf(name) {
    var parts = name.replace(/^--scheme-/, '').split('-').filter(Boolean);
    if ((parts[0] === 'colors' || parts[0] === 'color') && parts.length > 1) {
      return parts[1];
    }
    return parts[0] || 'other';
  }

  function isColorValue(value) {
    var v = (value || '').trim();
    return /^#([0-9a-f]{3,8})$/i.test(v) || /^(rgb|rgba|hsl|hsla)\(/i.test(v);
  }

  function toHexColor(value) {
    var v = (value || '').trim();
    var m = v.match(/^#([0-9a-f]{6})$/i);
    if (m) return '#' + m[1];
    m = v.match(/^#([0-9a-f]{3})$/i);
    if (m) {
      var s = m[1];
      return '#' + s[0] + s[0] + s[1] + s[1] + s[2] + s[2];
    }
    m = v.match(/^rgba?\(\s*(\d+)\s*,\s*(\d+)\s*,\s*(\d+)/i);
    if (m) {
      return '#' + [m[1], m[2], m[3]].map(function (n) {
        var h = parseInt(n, 10).toString(16);
        return h.length === 1 ? '0' + h : h;
      }).join('');
    }
    return null;
  }

  // Mirrors normalizeUrl in the capture function so the box shows the URL
  // that was actually loaded rather than the bare host that was typed.
  function normalizeUrl(raw) {
    var trimmed = String(raw).trim();
    if (/^[a-zA-Z][a-zA-Z0-9+.-]*:\/\//.test(trimmed)) return trimmed;
    return 'https://' + trimmed.replace(/^\/+/, '');
  }

  // Callers pass the URL explicitly. Reading the input box here instead
  // would make the box the source of truth, so "recapture the page in the
  // preview" would silently capture whatever had been typed since.
  async function loadPage(requestedUrl) {
    var url = String(requestedUrl == null ? '' : requestedUrl).trim();
    if (!url) {
      setStatus('Enter a URL first', true);
      return;
    }
    url = normalizeUrl(url);
    els.urlInput.value = url;
    setStatus('Loading real page… this can take a few seconds');
    els.loadBtn.disabled = true;

    // Edits are carried onto the next page so a scheme in progress can be
    // checked across several pages without re-entering it each time.
    var edits = {};
    Object.keys(state.current).forEach(function (name) {
      if (state.current[name] !== state.original[name]) edits[name] = state.current[name];
    });

    var payload = { url: url };
    if (els.loginFields.classList.contains('open') && els.userInput.value) {
      payload.user = els.userInput.value;
      payload.pass = els.passInput.value;
    }

    try {
      var res = await fetch('/.netlify/functions/capture', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      });
      var data = await res.json();
      if (!res.ok) {
        throw new Error(data && data.error ? data.error : 'Capture failed (' + res.status + ')');
      }

      state.original = data.root || {};
      state.current = Object.assign({}, state.original);

      var carried = 0;
      Object.keys(edits).forEach(function (name) {
        if (Object.prototype.hasOwnProperty.call(state.current, name)) {
          state.current[name] = edits[name];
          carried++;
        }
      });

      state.css = data.css || '';
      state.body = data.body || '';
      state.base = data.base || '';
      state.pageUrl = data.pageUrl || url;
      state.schemeNames = data.schemeNames || [];
      els.recaptureBtn.disabled = false;
      // Spell out the target, so it is clear this is tied to the previewed
      // page and not to the input box.
      els.recaptureBtn.title = 'Re-capture the page in the preview:\n' + state.pageUrl;

      // A redirect means the URL box no longer names what is on screen.
      if (state.pageUrl !== url) els.urlInput.value = state.pageUrl;

      // The previous selection belongs to a page that is gone.
      state.highlight = [];
      state.selected = null;
      state.hoverHref = null;
      els.inspector.classList.remove('open');

      renderGroups();
      renderPreview();
      setStatus(
        data.varCount + ' variables loaded' +
        (state.schemeNames.length ? ' · schemes: ' + state.schemeNames.join(', ') : '') +
        (carried ? ' · ' + carried + ' edit' + (carried === 1 ? '' : 's') + ' kept' : '') +
        (state.inspecting ? ' · click an element to inspect, a link to browse' : '')
      );
    } catch (err) {
      setStatus(err.message || 'Failed to load page', true);
    } finally {
      els.loadBtn.disabled = false;
    }
  }

  function renderPreview() {
    // Base is the captured page's own URL, not just its origin, so relative
    // links and assets in a subdirectory resolve the way they do on the
    // real site.
    var doc = '<!doctype html><html><head><base href="' + (state.pageUrl || state.base + '/') + '">' +
      '<style id="scheme-app-css">' + state.css + '</style>' +
      '<style id="scheme-app-vars">' + buildRootBlock(state.current) + '</style>' +
      '</head><body>' + state.body + '</body></html>';

    els.preview.style.display = '';
    els.placeholder.style.display = 'none';
    els.preview.srcdoc = doc;
  }

  function applyAllVars() {
    try {
      var docEl = els.preview.contentDocument.documentElement;
      Object.keys(state.current).forEach(function (name) {
        docEl.style.setProperty(name, state.current[name]);
      });
    } catch (err) {
      // Fallback: full re-render if direct DOM access is unavailable
      renderPreview();
    }
  }

  function applyVar(name, value) {
    try {
      els.preview.contentDocument.documentElement.style.setProperty(name, value);
    } catch (err) {
      renderPreview();
    }
  }

  function buildRootBlock(vars) {
    var lines = Object.keys(vars).sort().map(function (name) {
      return '  ' + name + ': ' + vars[name] + ';';
    });
    return ':root {\n' + lines.join('\n') + '\n}';
  }

  function renderGroups() {
    var filter = els.filterInput.value.trim().toLowerCase();
    var names = Object.keys(state.current).sort();
    var groups = {};

    names.forEach(function (name) {
      if (filter && name.toLowerCase().indexOf(filter) === -1) return;
      var fam = familyOf(name);
      if (!groups[fam]) groups[fam] = [];
      groups[fam].push(name);
    });

    var familyNames = Object.keys(groups).sort();
    els.groups.innerHTML = '';

    if (!familyNames.length) {
      var empty = document.createElement('div');
      empty.style.cssText = 'padding:16px;color:var(--app-muted);font-size:12px;';
      empty.textContent = names.length ? 'No variables match your filter.' : 'Load a page to see its scheme variables.';
      els.groups.appendChild(empty);
      return;
    }

    familyNames.forEach(function (fam) {
      var groupEl = document.createElement('div');
      groupEl.className = 'group';

      var header = document.createElement('div');
      header.className = 'group-header';
      header.innerHTML = '<span>' + fam + '</span><span class="group-count">' + groups[fam].length + '</span>';
      header.addEventListener('click', function () {
        groupEl.classList.toggle('collapsed');
      });
      groupEl.appendChild(header);

      var rowsEl = document.createElement('div');
      rowsEl.className = 'group-rows';

      groups[fam].forEach(function (name) {
        rowsEl.appendChild(buildRow(name));
      });

      groupEl.appendChild(rowsEl);
      els.groups.appendChild(groupEl);
    });
  }

  // One row control per variable, used by both the main list and the
  // inspector panel, so a variable is edited the same way wherever it shows.
  function buildRow(name) {
    var row = document.createElement('div');
    row.className = 'row';
    row.setAttribute('data-var', name);
    if (state.highlight.indexOf(name) !== -1) row.classList.add('highlight');

    var swatch = document.createElement('div');
    swatch.className = 'swatch';

    var label = document.createElement('div');
    label.className = 'name';
    label.innerHTML = '<span class="prefix">--scheme-</span>' + name.replace(/^--scheme-/, '');
    label.title = name;

    var input = document.createElement('input');
    input.className = 'value';
    input.type = 'text';
    input.addEventListener('change', function () {
      updateValue(name, input.value);
    });

    var resetBtn = document.createElement('button');
    resetBtn.className = 'reset';
    resetBtn.textContent = '↺';
    resetBtn.title = 'Reset to original value';
    resetBtn.addEventListener('click', function () {
      updateValue(name, state.original[name]);
    });

    row.appendChild(swatch);
    row.appendChild(label);
    row.appendChild(input);
    row.appendChild(resetBtn);

    row._varName = name;
    row._nameInput = input;
    row._nameSwatch = swatch;
    row._resetBtn = resetBtn;

    refreshRow(row);
    return row;
  }

  function refreshRow(row) {
    var name = row._varName;
    var value = state.current[name] || '';
    var changed = value !== state.original[name];

    row._nameInput.value = value;
    row._nameInput.classList.toggle('changed', changed);
    row._resetBtn.classList.toggle('visible', changed);

    var swatch = row._nameSwatch;
    var picker = swatch.querySelector('input[type="color"]');

    if (isColorValue(value)) {
      swatch.style.background = value;
      swatch.style.border = '1px solid var(--app-border)';
      var hex = toHexColor(value);
      if (hex && !picker) {
        picker = document.createElement('input');
        picker.type = 'color';
        picker.addEventListener('input', function () {
          updateValue(name, picker.value);
        });
        swatch.appendChild(picker);
      }
      // Leave the picker's own value alone while it is being dragged,
      // otherwise reassigning it mid-drag closes the OS colour dialog.
      if (picker && hex && document.activeElement !== picker) picker.value = hex;
      if (picker && !hex) swatch.removeChild(picker);
    } else {
      if (picker) swatch.removeChild(picker);
      swatch.style.background = 'transparent';
      swatch.style.border = '1px dashed var(--app-border)';
    }
  }

  function updateValue(name, value) {
    state.current[name] = value;
    applyVar(name, value);
    // The same variable can be on screen twice (list + inspector); keep
    // every instance showing the same value.
    var rows = document.querySelectorAll('[data-var="' + name + '"]');
    for (var i = 0; i < rows.length; i++) refreshRow(rows[i]);
  }

  function previewDoc() {
    try {
      return els.preview.contentDocument;
    } catch (err) {
      return null;
    }
  }

  function setInspecting(on) {
    state.inspecting = on;
    els.inspectBtn.classList.toggle('active', on);
    if (on) {
      enableInspect();
      setStatus('Inspect mode: click any element in the preview');
    } else {
      disableInspect();
      closeInspector();
      setStatus('');
    }
  }

  function enableInspect() {
    var doc = previewDoc();
    if (!doc || !doc.body) return false;
    doc.removeEventListener('mousemove', onPreviewHover, true);
    doc.removeEventListener('click', onPreviewClick, true);
    doc.addEventListener('mousemove', onPreviewHover, true);
    doc.addEventListener('click', onPreviewClick, true);
    doc.body.style.cursor = 'crosshair';
    return true;
  }

  function disableInspect() {
    var doc = previewDoc();
    if (!doc) return;
    doc.removeEventListener('mousemove', onPreviewHover, true);
    doc.removeEventListener('click', onPreviewClick, true);
    if (doc.body) doc.body.style.cursor = '';
    var overlay = doc.getElementById(OVERLAY_ID);
    if (overlay) overlay.style.display = 'none';
  }

  function ensureOverlay(doc) {
    var overlay = doc.getElementById(OVERLAY_ID);
    if (!overlay) {
      overlay = doc.createElement('div');
      overlay.id = OVERLAY_ID;
      overlay.style.cssText =
        'position:fixed;pointer-events:none;z-index:2147483647;' +
        'border:2px solid #5b8cff;background:rgba(91,140,255,0.12);display:none;';
      doc.documentElement.appendChild(overlay);
    }
    return overlay;
  }

  function outlineElement(el) {
    var doc = previewDoc();
    if (!doc || !el) return;
    var overlay = ensureOverlay(doc);
    var rect = el.getBoundingClientRect();
    overlay.style.display = 'block';
    overlay.style.left = rect.left + 'px';
    overlay.style.top = rect.top + 'px';
    overlay.style.width = rect.width + 'px';
    overlay.style.height = rect.height + 'px';
  }

  function onPreviewHover(e) {
    if (!e.target || e.target.id === OVERLAY_ID) return;
    outlineElement(e.target);

    var href = linkTargetOf(e.target);
    if (href !== state.hoverHref) {
      setHoverStatus(href ? '→ ' + href + '   (click to load · shift-click to inspect)' : '');
      state.hoverHref = href;
    }
  }

  function onPreviewClick(e) {
    e.preventDefault();
    e.stopPropagation();

    // A plain click on a link browses to it by re-capturing that URL, since
    // the preview is srcdoc and cannot navigate on its own. Shift-click
    // falls through to inspecting the link element itself.
    var href = e.shiftKey ? null : linkTargetOf(e.target);
    if (href) {
      loadPage(href);
      return;
    }

    selectElement(e.target);
  }

  // Resolves an anchor's href against the captured page's URL, and only for
  // links this app can actually capture.
  function linkTargetOf(node) {
    var el = node;
    while (el && el.nodeType === 1 && el.tagName !== 'A') el = el.parentElement;
    if (!el || el.nodeType !== 1) return null;

    var raw = el.getAttribute('href');
    if (!raw || raw.charAt(0) === '#') return null;

    try {
      var resolved = new URL(raw, state.pageUrl || state.base);
      if (!/^https?:$/.test(resolved.protocol)) return null;
      return resolved.toString();
    } catch (err) {
      return null;
    }
  }

  function selectElement(el) {
    if (!el || el.id === OVERLAY_ID) return;
    state.selected = el;
    outlineElement(el);

    var direct = schemeDeclsFor(el);
    var inside = schemeDeclsInside(el);
    renderInspector(el, direct, inside);

    var names = [];
    direct.concat(inside).forEach(function (d) {
      d.vars.forEach(function (n) {
        if (names.indexOf(n) === -1) names.push(n);
      });
    });
    state.highlight = names;
    renderGroups();

    els.inspector.classList.add('open');
  }

  function closeInspector() {
    els.inspector.classList.remove('open');
    state.selected = null;
    if (state.highlight.length) {
      state.highlight = [];
      renderGroups();
    }
    var doc = previewDoc();
    var overlay = doc && doc.getElementById(OVERLAY_ID);
    if (overlay) overlay.style.display = 'none';
  }

  function describeElement(el) {
    var text = el.tagName.toLowerCase();
    if (el.id) text += '#' + el.id;
    var cls = (el.getAttribute('class') || '').trim();
    if (cls) text += '.' + cls.split(/\s+/).slice(0, 3).join('.');
    return text;
  }

  function extractVarNames(value) {
    var names = [];
    var re = /var\(\s*(--scheme-[A-Za-z0-9_-]+)/g;
    var match;
    while ((match = re.exec(value))) {
      if (names.indexOf(match[1]) === -1) names.push(match[1]);
    }
    return names;
  }

  // Every declaration in the page that references a --scheme-* variable,
  // indexed once per capture. Built up front because inspecting a subtree
  // tests these against many elements, and re-walking every stylesheet each
  // time would be far slower than filtering a short pre-built list.
  function schemeRuleIndex() {
    if (state.ruleIndex) return state.ruleIndex;

    var doc = previewDoc();
    if (!doc) return [];

    var index = [];
    var seen = {};

    function walk(rules) {
      for (var i = 0; i < rules.length; i++) {
        var rule = rules[i];
        if (rule.cssRules && !rule.selectorText) {
          walk(rule.cssRules);
          continue;
        }
        if (!rule.selectorText || !rule.style) continue;

        var decls = authoredDeclarations(rule);
        for (var j = 0; j < decls.length; j++) {
          var key = decls[j].prop + '|' + decls[j].value + '|' + rule.selectorText;
          if (seen[key]) continue;
          seen[key] = true;
          index.push({
            prop: decls[j].prop,
            expr: decls[j].value,
            selector: rule.selectorText,
            vars: extractVarNames(decls[j].value),
          });
        }
      }
    }

    for (var s = 0; s < doc.styleSheets.length; s++) {
      var rules;
      try {
        rules = doc.styleSheets[s].cssRules;
      } catch (err) {
        continue;
      }
      if (rules) walk(rules);
    }

    state.ruleIndex = index;
    return index;
  }

  // Declarations applying to the element itself.
  function schemeDeclsFor(el) {
    return schemeRuleIndex().filter(function (rule) {
      return selectorMatches(el, rule.selector);
    });
  }

  // Declarations applying to anything inside the element. A container like a
  // review card carries almost no variables of its own - everything visible
  // in it (button, heading, stars) is styled by rules on its descendants.
  function schemeDeclsInside(el) {
    var out = [];
    schemeRuleIndex().forEach(function (rule) {
      var hits = matchesWithin(el, rule.selector);
      if (hits) out.push(Object.assign({}, rule, { count: hits }));
    });
    return out;
  }

  function matchesWithin(el, selectorText) {
    try {
      return el.querySelectorAll(selectorText).length;
    } catch (err) {
      try {
        return el.querySelectorAll(withoutPseudo(selectorText)).length;
      } catch (err2) {
        return 0;
      }
    }
  }

  function withoutPseudo(selectorText) {
    return selectorText.replace(/::?[a-zA-Z-]+(\([^)]*\))?/g, '');
  }

  // Reads declarations from the rule's own text rather than iterating
  // rule.style. CSSOM expands shorthands into longhands, and a longhand
  // whose value came from a shorthand containing var() reads back as an
  // empty string — so `background: var(--scheme-x)` is invisible via
  // rule.style. Parsing the authored text also keeps the property name the
  // author wrote instead of listing four border-*-color longhands.
  function authoredDeclarations(rule) {
    var out = [];
    var text = rule.cssText || '';
    var open = text.indexOf('{');
    var close = text.lastIndexOf('}');
    if (open === -1 || close === -1) return out;

    var block = text.slice(open + 1, close);
    var depth = 0;
    var current = '';
    var parts = [];
    for (var i = 0; i < block.length; i++) {
      var ch = block.charAt(i);
      if (ch === '(') depth++;
      else if (ch === ')') depth--;
      if (ch === ';' && depth === 0) {
        parts.push(current);
        current = '';
        continue;
      }
      current += ch;
    }
    parts.push(current);

    parts.forEach(function (decl) {
      var colon = decl.indexOf(':');
      if (colon === -1) return;
      var prop = decl.slice(0, colon).trim();
      var value = decl.slice(colon + 1).trim();
      if (!prop || value.indexOf('var(--scheme-') === -1) return;
      out.push({ prop: prop, value: value });
    });
    return out;
  }

  function selectorMatches(el, selectorText) {
    try {
      return el.matches(selectorText);
    } catch (err) {
      // Pseudo-element selectors (.btn::before) throw; match the base
      // selector so the pseudo-element's variables still surface.
      try {
        return el.matches(withoutPseudo(selectorText));
      } catch (err2) {
        return false;
      }
    }
  }

  function renderInspector(el, direct, inside) {
    var label = describeElement(el);
    els.inspectorTag.textContent = label;
    els.inspectorTag.title = label;
    els.inspectorBody.innerHTML = '';

    var shown = {};
    var directCount = renderVarSection('On this element', direct, el, shown, false);
    // Anything already listed above is skipped, so each variable gets one
    // editable row and the two sections read as a progression.
    var insideCount = renderVarSection('Inside this element', inside, el, shown, true);

    if (!directCount && !insideCount) {
      var empty = document.createElement('div');
      empty.id = 'inspectorEmpty';
      empty.textContent = 'No --scheme-* variables style this element or anything inside it.';
      els.inspectorBody.appendChild(empty);
    }
  }

  function renderVarSection(title, decls, el, shown, isDescendant) {
    var doc = previewDoc();
    var computed = doc && !isDescendant ? doc.defaultView.getComputedStyle(el) : null;

    // Group by variable so each appears once as a single editable row, with
    // the declarations that reference it listed underneath.
    var order = [];
    var usages = {};
    decls.forEach(function (d) {
      d.vars.forEach(function (name) {
        if (shown[name]) return;
        if (!usages[name]) {
          usages[name] = [];
          order.push(name);
        }
        usages[name].push(d);
      });
    });

    if (!order.length) return 0;

    var header = document.createElement('div');
    header.className = 'inspect-section';
    header.innerHTML = '<span>' + title + '</span><span>' + order.length + '</span>';
    els.inspectorBody.appendChild(header);

    order.forEach(function (name) {
      shown[name] = true;

      var wrap = document.createElement('div');
      wrap.className = 'inspect-var';

      var row = buildRow(name);
      // Every variable here relates to the selection, so the highlight that
      // marks them in the main list would just be noise in this panel.
      row.classList.remove('highlight');
      row.querySelector('.name').addEventListener('click', function () {
        jumpToVar(name);
      });
      row.querySelector('.name').title = name + ' — click to find it in the list below';
      wrap.appendChild(row);

      usages[name].forEach(function (d) {
        var usage = document.createElement('div');
        usage.className = 'decl-usage';

        // Only the selected element has a single computed value to report; a
        // descendant selector can match many elements at once.
        var resolved = computed ? computed.getPropertyValue(d.prop).trim() : '';
        // Shorthands compute to long strings ("rgb(16,24,32) none repeat
        // scroll 0% 0% / auto padding-box border-box") - not worth showing.
        if (resolved.length > 40) resolved = '';

        if (resolved && isColorValue(resolved)) {
          var chip = document.createElement('span');
          chip.className = 'chip';
          chip.style.background = resolved;
          usage.appendChild(chip);
        }

        var text = document.createElement('span');
        text.className = 'text';
        text.textContent =
          d.prop + ' · ' + d.selector +
          (resolved ? ' → ' + resolved : '') +
          (d.count > 1 ? '  ×' + d.count : '');
        usage.appendChild(text);
        usage.title = d.selector + ' { ' + d.prop + ': ' + d.expr + ' }';

        wrap.appendChild(usage);
      });

      els.inspectorBody.appendChild(wrap);
    });

    return order.length;
  }

  function jumpToVar(name) {
    var filter = els.filterInput.value.trim().toLowerCase();
    if (filter && name.toLowerCase().indexOf(filter) === -1) {
      els.filterInput.value = '';
      renderGroups();
    }
    var row = els.groups.querySelector('[data-var="' + name + '"]');
    if (!row) return;
    var group = row.closest('.group');
    if (group) group.classList.remove('collapsed');
    row.scrollIntoView({ block: 'center', behavior: 'smooth' });
    row.classList.remove('flash');
    void row.offsetWidth;
    row.classList.add('flash');
  }

  function openExport() {
    els.exportText.value = buildRootBlock(state.current);
    els.exportModal.classList.add('open');
  }

  function closeExport() {
    els.exportModal.classList.remove('open');
  }

  async function copyExport() {
    try {
      await navigator.clipboard.writeText(els.exportText.value);
      els.exportCopyBtn.textContent = 'Copied!';
    } catch (err) {
      els.exportText.select();
      document.execCommand('copy');
      els.exportCopyBtn.textContent = 'Copied!';
    }
    setTimeout(function () {
      els.exportCopyBtn.textContent = 'Copy';
    }, 1500);
  }
})();
</script>
</body>
</html>
